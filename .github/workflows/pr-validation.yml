# PR Validation — enforces policies without requiring GitHub Pro
name: "PR validation"
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: "PR checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR-supplied values reach the shell through env:, never inlined into the
      # script text. Inlining (BODY="${{ ... }}") executes every line of a
      # multi-line body as a command: dependabot bodies carry "@dependabot
      # rebase" lines, so this job exited 127 on every dependabot PR, and a body
      # containing $(...) would run arbitrary commands with these tokens.
      - name: "Branch naming convention"
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(issue|feat|fix|chore|ci|docs|dependabot)/[a-z0-9._-]+$ ]] || [[ "$BRANCH" =~ ^(issue|feat|fix|chore|ci|docs)-[0-9]+ ]]; then
            echo "✅ Branch name: $BRANCH"
          else
            echo "::warning::Branch '$BRANCH' doesn't follow convention"
            echo "Expected: feat/23-desc, fix/NNN-desc, chore/NNN-desc"
          fi

      - name: "Linked issue check"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE "(Closes|Fixes|Resolves|Related to) #[0-9]+"; then
            echo "✅ PR references an issue"
          else
            echo "::warning::PR body should contain 'Closes #NNN' or 'Related to #NNN'"
          fi

      - name: "Conventional commit title"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qiE "^(feat|fix|chore|refactor|docs|test|ci)(\([a-z]+\))?!?:"; then
            echo "✅ Title follows conventional commits"
          else
            echo "::warning::PR title should start with type: e.g. 'ci: add workflow (#23)'"
          fi

      - name: "Target branch check"
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            echo "✅ PR targets $BASE"
          else
            echo "::warning::PR targets '$BASE' — should be main"
          fi

      - name: "PR validation summary"
        if: always()
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch name | ✅ Convention checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Issue linked | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional title | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Target branch | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Lockfile + build | See the 'Deploy gate' job |" >> $GITHUB_STEP_SUMMARY

  # Deploy gate — runs the install and the build that the live deploy runs
  # (.github/workflows/cloudflare-pages.yml), so a lockfile desync or a broken
  # dependency pair fails on the PR instead of on main after the merge.
  #
  # Incident this closes (2026-10-16): dependabot npm-ecosystem PRs (#48
  # dompurify, #57 sharp) updated astro-portfolio/package.json but not
  # astro-portfolio/bun.lock. Every merge left bun.lock stale, and the deploy
  # died in "Install dependencies" with "lockfile had changes, but lockfile is
  # frozen" (deploy runs 38941683439, 38944611911). PR validation never ran an
  # install, so nothing caught it before main.
  #
  # The build step catches the second half of the same class: merging the react
  # bump (#62) without the react-dom bump (#69) failed the deploy with
  # "Incompatible React versions" (deploy run 38945749843).
  deploy-gate:
    name: "Deploy gate (bun frozen lockfile + build)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # Same bun as the deploy. The gate must not drift from the thing it gates.
      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Install dependencies (bun install --frozen-lockfile)"
        working-directory: astro-portfolio
        run: |
          if bun install --frozen-lockfile; then
            echo "✅ astro-portfolio/bun.lock matches astro-portfolio/package.json"
            exit 0
          fi
          echo "::error title=Stale bun.lock::astro-portfolio/bun.lock does not match astro-portfolio/package.json. Run 'cd astro-portfolio && bun install' and commit the updated bun.lock with your change."
          {
            echo "## ❌ Deploy gate: astro-portfolio/bun.lock is out of sync"
            echo ""
            echo 'The deploy installs with `bun install --frozen-lockfile` in `astro-portfolio/`, so `package.json` and `bun.lock` must move together.'
            echo ""
            echo "Fix:"
            echo ""
            echo '```sh'
            echo "cd astro-portfolio && bun install"
            echo "git add astro-portfolio/bun.lock"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Same build the deploy runs. Fails on dependency pairs that install fine
      # but cannot build together (react without react-dom, for example).
      - name: "Build static site (bun run build)"
        working-directory: astro-portfolio
        run: bun run build
