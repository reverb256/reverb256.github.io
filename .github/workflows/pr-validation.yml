# PR Validation — enforces policies without requiring GitHub Pro
name: "PR validation"
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: "PR checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR-supplied values reach the shell through env:, never inlined into the
      # script text. Inlining (BODY="${{ ... }}") executes every line of a
      # multi-line body as a command: dependabot bodies carry "@dependabot
      # rebase" lines, so this job exited 127 on every dependabot PR, and a body
      # containing $(...) would run arbitrary commands with these tokens.
      - name: "Branch naming convention"
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(issue|feat|fix|chore|ci|docs|dependabot)/[a-z0-9._-]+$ ]] || [[ "$BRANCH" =~ ^(issue|feat|fix|chore|ci|docs)-[0-9]+ ]]; then
            echo "✅ Branch name: $BRANCH"
          else
            echo "::warning::Branch '$BRANCH' doesn't follow convention"
            echo "Expected: feat/23-desc, fix/NNN-desc, chore/NNN-desc"
          fi

      - name: "Linked issue check"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE "(Closes|Fixes|Resolves|Related to) #[0-9]+"; then
            echo "✅ PR references an issue"
          else
            echo "::warning::PR body should contain 'Closes #NNN' or 'Related to #NNN'"
          fi

      - name: "Conventional commit title"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qiE "^(feat|fix|chore|refactor|docs|test|ci)(\([a-z]+\))?!?:"; then
            echo "✅ Title follows conventional commits"
          else
            echo "::warning::PR title should start with type: e.g. 'ci: add workflow (#23)'"
          fi

      - name: "Target branch check"
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            echo "✅ PR targets $BASE"
          else
            echo "::warning::PR targets '$BASE' — should be main"
          fi

      - name: "PR validation summary"
        if: always()
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch name | ✅ Convention checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Issue linked | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional title | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Target branch | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
