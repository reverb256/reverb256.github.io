# Cloudflare Pages Deployment — reverb256 portfolio
#
# Builds the Astro portfolio in astro-portfolio/ and publishes it to
# Cloudflare Pages, served at reverb256.ca via a custom domain.
#
# Requires these GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Account:Cloudflare Pages:Edit" + zone write
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   GITHUB_TOKEN          — auto-provided by GitHub, do NOT add
#
# Note: this runs alongside the existing Deploy to GitHub Pages workflow.
# Once Cloudflare Pages is live and reverb256.ca is re-pointed, disable the
# GitHub Pages workflow (deploy.yml) to avoid double deploy. See README.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: astro-portfolio
        run: bun install

      - name: Build static site
        working-directory: astro-portfolio
        run: bun run build

      - name: Copy CNAME for custom domain
        run: cp CNAME astro-portfolio/dist/CNAME

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: reverb256-portfolio
          directory: astro-portfolio/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'