# Cloudflare Pages Deployment — reverb256 portfolio
#
# Builds the Astro portfolio in astro-portfolio/ and publishes it to the
# Cloudflare Pages project `reverb256`, serving https://reverb256.ca.
#
# Requires these GitHub Actions secrets (set 2026-09-19):
#   CLOUDFLARE_API_TOKEN  — scoped token: Pages Write + Pages Read + Zone Read
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   GITHUB_TOKEN          — auto-provided by GitHub, do NOT add
#
# GitHub Pages (deploy.yml) is retired — this is the only deploy path.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: astro-portfolio
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: astro-portfolio
        run: bun run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy astro-portfolio/dist --project-name=reverb256 --branch=main

      # Regression gate: the live surface must pass the quick domain checks
      # (canonical, redirects, HTTPS). See scripts/verify-domains.sh.
      - name: Verify live deployment
        run: |
          for i in 1 2 3 4; do
            if bash scripts/verify-domains.sh --quick; then exit 0; fi
            echo "retry in 30s..."; sleep 30
          done
          exit 1
