version: 2
# Checked-in so Dependabot runs the correct ecosystem for this repo: the lockfile
# is bun.lock (text), and Dependabot supports `package-ecosystem: bun`.
# Symptom this fixes (2026-10-15): every Dependabot PR conflicted and could not be
# rebased — "Dependabot could not run Bun to update your dependencies due to a
# configuration error" — because the repo-level config did not drive Bun.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  # The deployed app: the Cloudflare Pages workflow builds astro-portfolio/ with
  # `bun install --frozen-lockfile`, so astro-portfolio/bun.lock is the lockfile
  # that must move with every dependency change. Without this entry the subdir
  # only ever got npm-shaped security PRs (e.g. #48/#57), which updated
  # package-lock.json, left bun.lock stale, and hard-failed the deploy with
  # "lockfile had changes, but lockfile is frozen" (run 38941683439, 2026-10-16).
  - package-ecosystem: "bun"
    directory: "/astro-portfolio"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
